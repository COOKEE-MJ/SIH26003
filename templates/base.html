<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Memory Care Platform{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <header class="navbar">
        <div class="nav-container">

            <a href="{{ url_for('home') }}" class="logo">
                🧠 Memory Care
            </a>

            <nav class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
            </nav>

        </div>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 Memory Care Platform | SIH 2026</p>
    </footer>

    {% block scripts %}
    {% endblock %}

</body>
</html>
