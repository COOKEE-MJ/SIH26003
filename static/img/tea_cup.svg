<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="teaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4db"/>
      <stop offset="100%" stop-color="#f5e1b5"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97736"/>
      <stop offset="100%" stop-color="#a84e1b"/>
    </linearGradient>
  </defs>
  <!-- Clean high-contrast background circle -->
  <circle cx="80" cy="80" r="74" fill="url(#teaGlow)" stroke="#c96b3c" stroke-width="4"/>
  
  <!-- Steam lines -->
  <path d="M68 38 Q64 26 70 18" stroke="#d97736" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M80 34 Q84 22 78 14" stroke="#d97736" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M92 38 Q88 26 94 18" stroke="#d97736" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Saucer -->
  <ellipse cx="80" cy="118" rx="46" ry="10" fill="#edd6b1" stroke="#944315" stroke-width="3"/>
  <ellipse cx="80" cy="116" rx="38" ry="6" fill="#fcf6ec"/>

  <!-- Cup body -->
  <path d="M44 58 L116 58 C114 96 102 112 80 112 C58 112 46 96 44 58 Z" fill="url(#cupGrad)" stroke="#6e2e0b" stroke-width="3.5"/>
  
  <!-- Tea surface -->
  <ellipse cx="80" cy="58" rx="36" ry="9" fill="#54250e" stroke="#6e2e0b" stroke-width="2"/>
  <ellipse cx="80" cy="59" rx="30" ry="6" fill="#873f17"/>

  <!-- Handle -->
  <path d="M112 66 C128 66 130 92 110 96" fill="none" stroke="url(#cupGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M112 66 C128 66 130 92 110 96" fill="none" stroke="#6e2e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bold text banner for dementia clarity -->
  <rect x="25" y="128" width="110" height="24" rx="12" fill="#2d4a3e"/>
  <text x="80" y="144" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">GARAM CHAI</text>
</svg>

