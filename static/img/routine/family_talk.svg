<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background -->
  <circle cx="80" cy="80" r="74" fill="#fffcf5" stroke="#c96b3c" stroke-width="3.5"/>
  <!-- Person 1 (left) — head -->
  <circle cx="50" cy="48" r="10" fill="none" stroke="#1e5548" stroke-width="2.5"/>
  <!-- Person 1 — body seated -->
  <line x1="50" y1="58" x2="50" y2="82" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <!-- Person 1 — arm reaching toward center -->
  <line x1="50" y1="68" x2="72" y2="74" stroke="#1e5548" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Person 1 — legs (seated, bent) -->
  <line x1="50" y1="82" x2="40" y2="100" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="82" x2="58" y2="100" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <!-- Person 2 (right) — head -->
  <circle cx="110" cy="48" r="10" fill="none" stroke="#1e5548" stroke-width="2.5"/>
  <!-- Person 2 — body seated -->
  <line x1="110" y1="58" x2="110" y2="82" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <!-- Person 2 — arm reaching toward center -->
  <line x1="110" y1="68" x2="88" y2="74" stroke="#1e5548" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Person 2 — legs (seated, bent) -->
  <line x1="110" y1="82" x2="100" y2="100" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="82" x2="118" y2="100" stroke="#1e5548" stroke-width="3" stroke-linecap="round"/>
  <!-- Speech lines between them -->
  <line x1="64" y1="56" x2="96" y2="56" stroke="#c96b3c" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.75"/>
  <line x1="60" y1="64" x2="100" y2="64" stroke="#c96b3c" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.55"/>
  <!-- Ground line -->
  <line x1="28" y1="100" x2="132" y2="100" stroke="#1e5548" stroke-width="2" opacity="0.3"/>
  <!-- Label banner -->
  <rect x="14" y="110" width="132" height="24" rx="12" fill="#1e5548"/>
  <text x="80" y="126" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FAMILY TALK</text>
</svg>

