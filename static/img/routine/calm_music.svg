<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background -->
  <circle cx="80" cy="80" r="74" fill="#fffcf5" stroke="#c96b3c" stroke-width="3.5"/>
  <!-- Speaker body (rounded rectangle) -->
  <rect x="42" y="60" width="36" height="46" rx="8" fill="none" stroke="#1e5548" stroke-width="3"/>
  <!-- Speaker grille dots -->
  <circle cx="60" cy="75" r="3" fill="#1e5548" opacity="0.4"/>
  <circle cx="60" cy="84" r="3" fill="#1e5548" opacity="0.4"/>
  <circle cx="60" cy="93" r="3" fill="#1e5548" opacity="0.4"/>
  <!-- Speaker cone (circle on front) -->
  <circle cx="60" cy="83" r="14" fill="none" stroke="#1e5548" stroke-width="2"/>
  <!-- Sound waves -->
  <path d="M90 72 Q102 83 90 94" fill="none" stroke="#c96b3c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96 65 Q114 83 96 101" fill="none" stroke="#c96b3c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M103 58 Q126 83 103 108" fill="none" stroke="#c96b3c" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <!-- Musical note -->
  <line x1="110" y1="44" x2="110" y2="28" stroke="#1e5548" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="107" cy="45" rx="6" ry="4" fill="#1e5548"/>
  <!-- Label banner -->
  <rect x="22" y="118" width="116" height="24" rx="12" fill="#1e5548"/>
  <text x="80" y="134" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CALM MUSIC</text>
</svg>

