  <!-- Basin outline -->
  <path d="M34 72 Q34 108 80 108 Q126 108 126 72 Z" fill="none" stroke="#1e5548" stroke-width="3" stroke-linejoin="round"/>
  <!-- Basin rim top -->
  <ellipse cx="80" cy="72" rx="46" ry="10" fill="none" stroke="#1e5548" stroke-width="3"/>
  <!-- Basin drain -->
  <ellipse cx="80" cy="105" rx="8" ry="3" fill="none" stroke="#1e5548" stroke-width="2"/>
  <!-- Tap / faucet -->
  <rect x="70" y="40" width="20" height="8" rx="4" fill="none" stroke="#1e5548" stroke-width="2.5"/>
  <rect x="78" y="48" width="4" height="14" fill="none" stroke="#1e5548" stroke-width="2.5"/>
  <!-- Water splash drops -->
  <ellipse cx="80" cy="66" rx="3" ry="5" fill="#1e5548" opacity="0.7"/>
  <ellipse cx="68" cy="70" rx="2.5" ry="4" fill="#1e5548" opacity="0.5"/>
  <ellipse cx="92" cy="70" rx="2.5" ry="4" fill="#1e5548" opacity="0.5"/>
  <ellipse cx="74" cy="62" rx="2" ry="3" fill="#1e5548" opacity="0.4"/>
  <ellipse cx="86" cy="62" rx="2" ry="3" fill="#1e5548" opacity="0.4"/>
  <!-- Label banner -->
  <rect x="22" y="118" width="116" height="24" rx="12" fill="#1e5548"/>
  <text x="80" y="134" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">WASH FACE</text>
</svg>

