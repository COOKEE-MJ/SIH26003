<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background -->
  <circle cx="80" cy="80" r="74" fill="#fffcf5" stroke="#c96b3c" stroke-width="3.5"/>
  <!-- Ground line -->
  <line x1="20" y1="115" x2="140" y2="115" stroke="#1e5548" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body torso -->
  <line x1="80" y1="60" x2="80" y2="92" stroke="#1e5548" stroke-width="4" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="80" cy="50" r="12" fill="none" stroke="#1e5548" stroke-width="3"/>
  <!-- Left arm swinging forward -->
  <line x1="80" y1="68" x2="60" y2="84" stroke="#1e5548" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right arm swinging back -->
  <line x1="80" y1="68" x2="100" y2="76" stroke="#1e5548" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left leg forward (stride) -->
  <line x1="80" y1="92" x2="62" y2="115" stroke="#1e5548" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg back -->
  <line x1="80" y1="92" x2="96" y2="115" stroke="#1e5548" stroke-width="4" stroke-linecap="round"/>
  <!-- Left foot -->
  <line x1="62" y1="115" x2="52" y2="115" stroke="#1e5548" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right foot -->
  <line x1="96" y1="115" x2="106" y2="115" stroke="#1e5548" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Path dots on ground -->
  <circle cx="50" cy="117" r="2" fill="#c96b3c" opacity="0.5"/>
  <circle cx="110" cy="117" r="2" fill="#c96b3c" opacity="0.5"/>
  <!-- Label banner -->
  <rect x="22" y="124" width="116" height="24" rx="12" fill="#1e5548"/>
  <text x="80" y="140" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SHORT WALK</text>
</svg>

